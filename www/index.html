<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}:root{color-scheme:light dark}</style>
<title>رحلة الأوراد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: ورد واحد في المنتصف بحلقة تقدّم كبيرة، شريط أوراد أعلاه، وتبويبات سفلية ثابتة.
   Palette: ink-teal + amber gold on cool slate paper. Type: Reem Kufi (display) + Tajawal (UI) + Amiri (نصوص الأذكار). */
:root{
  --bg:#e8eef1; --surface:#f6f9fa; --ink:#13262d; --muted:#5a6f77; --line:#cbd8de;
  --accent:#0d7a69; --accent-ink:#ffffff; --gold:#b97a12; --gold-soft:#f3e3c1; --good:#0d7a69;
  --f-display:'Reem Kufi','Tajawal',system-ui,sans-serif; --f-body:'Tajawal',system-ui,sans-serif; --f-text:'Amiri','Tajawal',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a20; --surface:#152730; --ink:#e5f0f2; --muted:#8ea8b0; --line:#25404b;
  --accent:#3dbba5; --accent-ink:#06211c; --gold:#e3a93d; --gold-soft:#3a2f14; --good:#3dbba5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a20; --surface:#152730; --ink:#e5f0f2; --muted:#8ea8b0; --line:#25404b;
  --accent:#3dbba5; --accent-ink:#06211c; --gold:#e3a93d; --gold-soft:#3a2f14; --good:#3dbba5; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px}
.lvl{font-size:14px;color:var(--muted)}
.lvl b{font-family:var(--f-display);color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.xpbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.xpbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .35s ease}
.xpmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;min-width:92px;text-align:center}
.chip span{display:block;font-size:14px;font-weight:500}
.chip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.done small{color:var(--gold);font-weight:700}

.stage{display:grid;justify-items:center;gap:6px;padding:6px 0 4px}
.ringwrap{position:relative;width:min(78vw,288px);aspect-ratio:1}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:9;stroke-linecap:round}
.r-track{stroke:var(--line)}
.r-prog{stroke:var(--accent);transition:stroke-dashoffset .25s ease,stroke .2s}
.complete .r-prog{stroke:var(--gold)}
.bigbtn{position:absolute;inset:16px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-content:center;gap:0;text-align:center;
  box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s,box-shadow .08s,background .2s;user-select:none;-webkit-user-select:none}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.complete .bigbtn{background:var(--gold);color:#fff;box-shadow:0 8px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.complete .bigbtn:active{box-shadow:0 2px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.cnt{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.of{font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.pulse{animation:pulse .22s ease-out}
@keyframes pulse{0%{scale:1}40%{scale:1.035}100%{scale:1}}
.wtext{font-family:var(--f-display);font-weight:600;font-size:21px;text-align:center;margin:10px 0 0;text-wrap:balance}
.tools{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:6px 14px;font-size:14px;color:var(--muted)}
.ghost:disabled{opacity:.4}
.sum{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--surface);display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--f-display);font-size:18px}

h2{font-family:var(--f-display);font-size:20px;margin:14px 0 8px}
h3{font-family:var(--f-display);font-size:16px;margin:16px 0 6px;color:var(--gold)}
.card{background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px}
.card.claimed{opacity:.6}
.card p{margin:0 0 8px;font-weight:500}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.claim{border:0;background:var(--gold);color:#fff;border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px}
.claim:disabled{background:var(--line);color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* الجلسات: أذكار، حزب، نوافل */
.shead{background:var(--surface);border-radius:18px;padding:12px 14px;margin:2px 0 12px}
.shead .st{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.shead b{font-family:var(--f-display);font-size:18px}
.shead span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.shead.complete .bar i{background:var(--gold)}
.shead .hint{margin:8px 0 0}
.it{background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px;border:1.5px solid transparent}
.it.dn{opacity:.72;border-color:var(--accent)}
.it .tx{font-family:var(--f-text);font-size:20px;line-height:2;margin:0 0 6px}
.it .ln{display:block}
.it .ln b{font-family:var(--f-body);font-size:16px;color:var(--accent)}
.it .hd{font-weight:700}
.it .ft{display:block;margin-top:6px;color:var(--accent);font-weight:700}
.rp{font-family:var(--f-body);font-style:normal;font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap}
.it .meta{font-size:13px;color:var(--muted);margin:0 0 10px}
.it .meta .rp{margin-inline-end:6px}
.it .sec{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.it .row{display:flex;gap:8px;align-items:center}
.cb{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.cb:active{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.it.dn .cb{background:var(--accent);color:var(--accent-ink)}
.ist{font-family:var(--f-text);font-size:19px;text-align:center;margin:2px 0 12px;color:var(--ink)}
.nfh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.nfh b{font-family:var(--f-display);font-size:17px}
.nfh .rp{font-size:13px}
.it .d{font-size:14px;color:var(--muted);margin:0 0 10px}
.gnote{font-size:13px;color:var(--muted);margin:-2px 0 8px}

.bl{display:flex;align-items:center;gap:10px}
.bell{padding:2px 10px;font-size:13px;border-radius:10px}
.rr{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.rr .rl{flex:1;min-width:0;font-weight:500}
.rr input[type=time]{font:inherit;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;direction:ltr}
.rr input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{background:var(--surface);border-radius:16px;padding:12px;border:1.5px solid transparent}
.badge b{display:block;font-family:var(--f-display);font-size:16px}
.badge span{font-size:13px;color:var(--muted)}
.badge.on{border-color:var(--gold);background:var(--gold-soft)}
.badge:not(.on){opacity:.55}
.note{margin:18px 0 0;font-size:13px;color:var(--muted);text-align:center;text-wrap:balance}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs div{display:flex;width:100%;max-width:520px;gap:4px}
.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:12px;padding:8px 2px;font-size:13px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#toast{position:fixed;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:20;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:14px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.xpbar i,.r-prog,.bigbtn,.bar i{transition:none}}
</style>
</head><body>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="toprow"><div class="bl"><div class="brand">رحلة الأوراد</div><button class="ghost bell" data-act="tab" data-tab="rem">التنبيهات</button></div><div class="lvl"><span id="lvlName"></span> · مستوى <b id="lvlNum"></b></div></div>
    <div class="xpbar"><i id="xpFill"></i></div>
    <div class="xpmeta"><span id="xpTxt"></span><span id="streakTxt"></span></div>
  </header>
  <main id="view"></main>
  <p class="note" id="saveNote"></p>
</div>
<nav class="tabs" dir="rtl"><div role="tablist">
  <button class="tab" role="tab" data-act="tab" data-tab="today">العدّاد</button>
  <button class="tab" role="tab" data-act="tab" data-tab="adh">الأذكار</button>
  <button class="tab" role="tab" data-act="tab" data-tab="naf">النوافل</button>
  <button class="tab" role="tab" data-act="tab" data-tab="chal">التحديات</button>
  <button class="tab" role="tab" data-act="tab" data-tab="badges">الإنجازات</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const WIRDS=[
 {id:'salawat',t:'اللهم صلِّ وسلِّم على نبينا محمد',s:'الصلاة على النبي',g:100},
 {id:'istighfar',t:'أستغفر الله العظيم',s:'الاستغفار',g:100},
 {id:'tahlil',t:'لا إله إلا الله',s:'التهليل',g:100},
 {id:'tasbih',t:'سبحان الله وبحمده',s:'التسبيح',g:100},
 {id:'hawqala',t:'لا حول ولا قوة إلا بالله',s:'الحوقلة',g:50},
 {id:'takbir',t:'الله أكبر',s:'التكبير',g:33}
];
const GOALS=[33,50,100,300,500,1000];
const TITLES=['مبتدئ','ذاكر','مواظب','مثابر','راسخ','ثابت','سابق','علوّ الهمّة'];

/* أذكار الصباح والمساء. s: b للصباح والمساء، m للصباح فقط، e للمساء فقط. te: نص المساء إن اختلف */
const ADH=[
 {id:'a1',s:'b',n:1,t:'آية الكرسي',v:'لا يقربه شيطان، وسبب لدخول الجنة'},
 {id:'a2',s:'e',n:1,t:'آخر آيتين من سورة البقرة',v:'تكفيه من شرور كل شيء'},
 {id:'a3',s:'b',n:3,t:'سورة الإخلاص والمعوّذتين: الفلق والناس',v:'تكفيه من كل شيء'},
 {id:'a4',s:'b',n:3,t:'«بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم»',v:'لا يصيبه فجأة بلاء ولا يضرّه شيء'},
 {id:'a5',s:'b',n:3,t:'«أعوذ بكلمات الله التامات من شر ما خلق»',v:'محصّنة للأماكن من كل ضرر'},
 {id:'a6',s:'b',n:7,t:'«حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم»',v:'كفاه الله ما أهمّه من أمر الدنيا والآخرة'},
 {id:'a7',s:'b',n:3,t:'«رضيت بالله ربًّا، وبالإسلام دينًا، وبمحمد ﷺ نبيًّا»',v:'كان حقًّا على الله أن يرضيه'},
 {id:'a8',s:'b',n:1,t:'«اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور»',te:'«اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير»',v:'ورد الحثّ عليها'},
 {id:'a9',s:'m',n:1,t:'«أصبحنا على فطرة الإسلام، وكلمة الإخلاص، ودين نبينا محمد ﷺ وملة أبينا إبراهيم حنيفًا مسلمًا وما كان من المشركين»',v:'كان النبي ﷺ يدعو بها'},
 {id:'a10',s:'b',n:1,t:'«اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ»',te:'«اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ»',v:'أدّى شكر يومه وليلته'},
 {id:'a11',s:'b',n:4,t:'«اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَأَنْبِيَاءَكَ وَجَمِيعَ خَلْقِكَ بِأَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ»',te:'«اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَأَنْبِيَاءَكَ وَجَمِيعَ خَلْقِكَ بِأَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ»',v:'من قالها أربعًا أعتقه الله من النار'},
 {id:'a12',s:'b',n:1,t:'«اللهم فاطر السموات والأرض عالم الغيب والشهادة رب كل شيء ومليكه أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي ومن شر الشيطان وشركه وأن أقترف على نفسي سوءًا أو أجرّه إلى مسلم»',v:'تحميه من وساوس الشيطان'},
 {id:'a13',s:'b',n:1,t:'«اللهم إني أعوذ بك من الهم والحزن وأعوذ بك من العجز والكسل وأعوذ بك من الجبن والبخل وأعوذ بك من غلبة الدين وقهر الرجال»',v:'تذهب همّه وغمّه ويقضي دينه'},
 {id:'a14',s:'b',n:1,t:'(سيد الاستغفار) «اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ»',v:'من قاله موقنًا به فمات من يومه أو ليلته فهو من أهل الجنة'},

function fresh(){return {v:2,xp:0,day:dayKey(),counts:{},goals:{},life:{},done:[],claimed:[],streak:0,best:0,lastQual:'',badges:[],chalDone:0,t:0,pr:emptyPr(),sd:[],tot:{},rem:{}}}
function norm(r){const s=Object.assign(fresh(),r||{});s.counts=s.counts||{};s.goals=s.goals||{};s.life=s.life||{};s.done=s.done||[];s.claimed=s.claimed||[];s.badges=s.badges||[];
 s.tot=s.tot||{};s.rem=s.rem||{};s.sd=s.sd||[];s.pr=Object.assign(emptyPr(),s.pr||{});for(const k of Object.keys(emptyPr()))s.pr[k]=s.pr[k]||{};return s}
function rollover(s){if(s.day!==dayKey()){s.day=dayKey();s.counts={};s.done=[];s.claimed=[];s.pr=emptyPr();s.sd=[]}}
const goalOf=(s,id)=>s.goals[id]||wird(id).g;
const effStreak=s=>(s.lastQual===dayKey()||s.lastQual===yKey())?s.streak:0;
function lvlOf(xp){const n=Math.floor(Math.sqrt(xp/120))+1;const a=120*(n-1)*(n-1),b=120*n*n;return{n,a,b,p:(xp-a)/(b-a)}}
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todaysChals(){const r=rng(dayKey()+'awrad');const p=POOL.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
 const out=[];const kinds={};for(const c of p){if((kinds[c.k]||0)<1&&out.length<3){out.push(c);kinds[c.k]=(kinds[c.k]||0)+1}}return out}

function listOf(x){if(x==='am')return ADH.filter(i=>i.s!=='e');if(x==='pm')return ADH.filter(i=>i.s!=='m');if(x==='nf')return NAF;return HZ}
function need(x,id){return(x==='am'||x==='pm')?ADH.find(i=>i.id===id).n:1}
function doneCount(x){return listOf(x).filter(i=>(S.pr[x][i.id]||0)>=need(x,i.id)).length}
const sessDone=()=>S.sd.filter(x=>x!=='nf').length;
function prog(c,s){let v;
 if(c.k==='wird')v=s.counts[c.w]||0;else if(c.k==='total')v=sum(s.counts);else if(c.k==='goals')v=s.done.length;
 else if(c.k==='sess')v=s.sd.filter(x=>x!=='nf').length;
 else if(c.k==='naf')v=listOf('nf').filter(i=>(s.pr.nf[i.id]||0)>=1).length;
 else v=(s.pr.nf[c.w]||0)>=1?1:0;
 return Math.min(v,c.n)}

function setMode(m){mode=m;$('#saveNote').textContent=m==='cloud'?'تقدّمك محفوظ في حسابك ويظهر على أي جهاز تفتح منه الصفحة.':'تقدّمك محفوظ على هذا الجهاز فقط.'}
function touch(){S.t=Date.now();schedSoon();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
async function flush(){if(!docRef)return;if(writing){dirty=true;return}writing=true;

function checkBadges(){for(const b of BADGES){if(!S.badges.includes(b.id)&&b.f(S)){S.badges.push(b.id);toast('إنجاز جديد: '+b.n)}}}
function qualify(){if(S.lastQual!==dayKey()&&(S.done.length+S.sd.length)>=2){S.streak=(S.lastQual===yKey())?S.streak+1:1;S.lastQual=dayKey();S.best=Math.max(S.best,S.streak);toast('سلسلتك '+S.streak+' '+(S.streak===1?'يوم':'أيام'))}}

function tap(){
 rollover(S);const w=cur,g=goalOf(S,w),before=lvlOf(S.xp).n;
 S.counts[w]=(S.counts[w]||0)+1;S.life[w]=(S.life[w]||0)+1;S.xp+=1;
 if(S.counts[w]>=g&&!S.done.includes(w)){S.done.push(w);S.xp+=20;toast('أتممت '+wird(w).s+' · ‎+20 نقطة');buzz([30,40,30]);qualify()}else buzz(12);
 const after=lvlOf(S.xp).n;if(after>before)toast('ارتقيت إلى المستوى '+after+' · '+TITLES[Math.min(after-1,TITLES.length-1)]);
 checkBadges();touch();live(true)}
function undo(){const w=cur;if(!(S.counts[w]>0))return;if(S.done.includes(w)&&S.counts[w]<=goalOf(S,w))return;
 S.counts[w]--;S.life[w]=Math.max(0,(S.life[w]||0)-1);S.xp=Math.max(0,S.xp-1);touch();live(false)}
function cycleGoal(){const g=goalOf(S,cur);const i=GOALS.indexOf(g);S.goals[cur]=GOALS[(i+1)%GOALS.length];
 if((S.counts[cur]||0)>=S.goals[cur]&&!S.done.includes(cur)){S.done.push(cur);S.xp+=20;qualify();toast('أتممت '+wird(cur).s+' · ‎+20 نقطة')}
 touch();live(false)}
function claim(id){const c=POOL.find(x=>x.id===id);if(!c||S.claimed.includes(id)||prog(c,S)<c.n)return;
 S.claimed.push(id);S.xp+=30;S.chalDone++;toast('تحدٍّ مكتمل · ‎+30 نقطة');buzz([30,40,30]);checkBadges();touch();render()}

/* تغيير عدّاد بند في جلسة (أذكار، حزب، نوافل) مع احتساب النقاط والمكافأة */
function setCnt(x,id,v){
 rollover(S);
 const nd=need(x,id),pr=S.pr[x],old=pr[id]||0;v=Math.max(0,Math.min(nd,v));if(v===old)return;
 const before=lvlOf(S.xp).n;
 if(v===0)delete pr[id];else pr[id]=v;
 const wasD=old>=nd,isD=v>=nd;
 if(!wasD&&isD){S.xp+=PTS[x];if(x==='nf'&&id==='witr')S.tot.witr=tot(S,'witr')+1}
 if(wasD&&!isD){S.xp=Math.max(0,S.xp-PTS[x]);if(x==='nf'&&id==='witr')S.tot.witr=Math.max(0,tot(S,'witr')-1)}
 const all=listOf(x).every(i=>(pr[i.id]||0)>=need(x,i.id)),has=S.sd.includes(x);
 if(all&&!has){S.sd.push(x);S.xp+=BONUS[x];S.tot[x]=tot(S,x)+1;toast('أتممت '+SN[x]+' · ‎+'+BONUS[x]+' نقطة');buzz([30,40,30]);qualify()}
 else if(!all&&has){S.sd=S.sd.filter(i=>i!==x);S.xp=Math.max(0,S.xp-BONUS[x]);S.tot[x]=Math.max(0,tot(S,x)-1)}
 else if(!wasD&&isD)buzz(14);
 const after=lvlOf(S.xp).n;if(after>before)toast('ارتقيت إلى المستوى '+after+' · '+TITLES[Math.min(after-1,TITLES.length-1)]);
 checkBadges();touch();head();fillSess()}

function nextAt(h,m,skipToday){const d=new Date();d.setHours(h,m,0,0);if(skipToday||d<=new Date())d.setDate(d.getDate()+1);return d}
async function refreshPerm(){try{const p=await LN.checkPermissions();permState=p.display}catch(e){permState='unknown'}}
async function ensureChannel(){try{await LN.createChannel({id:'awrad',name:'تذكير الأوراد',importance:4,visibility:1})}catch(e){}}
async function scheduleAll(force){if(!LN)return;
 try{await refreshPerm();if(permState!=='granted')return;
  const list=[];
  REMS.forEach((r,i)=>{const c=remCfg(r);if(!c.on)return;const [h,m]=c.t.split(':').map(Number);if(isNaN(h)||isNaN(m))return;
   const at=nextAt(h,m,r.done(S)&&S.day===dayKey());
   list.push({id:101+i,title:'رحلة الأوراد',body:r.b,schedule:{at,repeats:true,every:'day',allowWhileIdle:true},channelId:'awrad',extra:{go:r.go}})});
  const sig=JSON.stringify(list.map(n=>[n.id,+n.schedule.at]));if(sig===lastSig&&!force)return;
  await ensureChannel();
  const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.filter(n=>n.id!==999).map(n=>({id:n.id}))});
  if(list.length)await LN.schedule({notifications:list});
  lastSig=sig}catch(e){}}
function schedSoon(){clearTimeout(schedT);schedT=setTimeout(scheduleAll,2500)}
let diag='';
function initNotif(){try{
 const cap=window.Capacitor;
 if(!cap){diag='Capacitor: none';return}
 const plat=cap.getPlatform?cap.getPlatform():(cap.isNativePlatform&&cap.isNativePlatform()?'native':'web');
 diag='Capacitor: yes / platform: '+plat;
 if(plat==='web')return;
 let p=null;
 try{if(cap.registerPlugin)p=cap.registerPlugin('LocalNotifications')}catch(e){diag+=' / reg: '+e}
 if(!p&&cap.Plugins&&cap.Plugins.LocalNotifications)p=cap.Plugins.LocalNotifications;
 if(!p){diag+=' / plugin: none';return}
 LN=p;diag+=' / plugin: ok';
 try{LN.addListener('localNotificationActionPerformed',e=>{const g=e&&e.notification&&e.notification.extra&&e.notification.extra.go;if(!g)return;tab=g[0];if(tab==='adh'&&g[1])sub=g[1];if(tab==='today'&&g[1])cur=g[1];render()})}catch(e){}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover(S);render();schedSoon()}});
 refreshPerm().then(()=>{if(tab==='rem')render();schedSoon()})
}catch(e){LN=null;diag+=' / err: '+e}}
async function askPerm(){if(!LN){toast('التنبيهات تعمل داخل التطبيق المثبّت على الهاتف');return}
 try{const p=await LN.requestPermissions();permState=p.display}catch(e){}
 await scheduleAll(true);if(tab==='rem')render();
 toast(permState==='granted'?'تم تفعيل التنبيهات':'لم يُسمح بالتنبيهات، فعّلها من إعدادات الهاتف')}
async function testNotif(){if(!LN){toast('التنبيهات تعمل داخل التطبيق المثبّت على الهاتف');return}
 await refreshPerm();if(permState!=='granted'){await askPerm();if(permState!=='granted')return}
 try{await ensureChannel();await LN.schedule({notifications:[{id:999,title:'رحلة الأوراد',body:'هذا تنبيه تجريبي',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:'awrad'}]});toast('سيصلك التنبيه بعد 5 ثوانٍ')}catch(e){toast('تعذّر إرسال التنبيه')}}
function remHTML(){
 const st=LN?(permState==='granted'?'التنبيهات مفعّلة.':'التنبيهات غير مفعّلة بعد. اضغط «تفعيل التنبيهات».'):'التنبيهات تعمل بعد تثبيت التطبيق على الهاتف. يمكنك ضبط الأوقات من الآن وستُحفظ.';
 return `<div class="tools" style="justify-content:flex-start"><button class="ghost" data-act="tab" data-tab="today">رجوع</button></div><h2>التنبيهات</h2><p class="hint">${st} يُتخطّى تنبيه اليوم إذا أتممتَ ما يخصّه.</p>`
 +REMS.map(r=>{const c=remCfg(r);return `<div class="rr"><label class="rl" for="on_${r.id}">${r.n}</label><input type="time" id="t_${r.id}" data-rid="${r.id}" value="${c.t}" aria-label="وقت ${r.n}"><input type="checkbox" id="on_${r.id}" data-rid="${r.id}" ${c.on?'checked':''}></div>`}).join('')
 +`<div class="tools"><button class="ghost" data-act="perm">تفعيل التنبيهات</button><button class="ghost" data-act="ntest">تنبيه تجريبي</button></div>
 <p class="note" dir="ltr" style="font-size:11px">${diag}</p>
 <p class="note">الأوقات افتراضية، فعدّلها لتناسب أوقات الصلاة في مدينتك.</p>`}

const C=2*Math.PI*96;
function head(){const L=lvlOf(S.xp);$('#lvlName').textContent=TITLES[Math.min(L.n-1,TITLES.length-1)];$('#lvlNum').textContent=L.n;
 $('#xpFill').style.width=Math.round(L.p*100)+'%';$('#xpTxt').textContent=S.xp+' نقطة · التالي '+L.b;
 const st=effStreak(S);$('#streakTxt').textContent=st?('سلسلة '+st+(st===1?' يوم':' أيام')):'ابدأ سلسلتك اليوم'}
function chipsHTML(){return WIRDS.map(w=>{const c=S.counts[w.id]||0,g=goalOf(S,w.id),d=S.done.includes(w.id);
 return `<button class="chip${d?' done':''}" data-act="pick" data-w="${w.id}" aria-pressed="${w.id===cur}"><span>${w.s}</span><small>${c} / ${g}${d?' ✓':''}</small></button>`}).join('')}
function todayHTML(){const w=wird(cur);return `
<div class="chips" id="chips">${chipsHTML()}</div>
<div class="stage" id="stage">
 <div class="ringwrap" id="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="r-track" cx="100" cy="100" r="96"/><circle class="r-prog" id="ring" cx="100" cy="100" r="96" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
  <button class="bigbtn" id="bigbtn" data-act="tap" aria-label="عدّ ذكراً"><span class="cnt" id="cnt">0</span><span class="of" id="of"></span></button></div>
 <p class="wtext" id="wtext">${w.t}</p>
 <div class="tools"><button class="ghost" id="undoBtn" data-act="undo">تراجع</button><button class="ghost" id="goalBtn" data-act="goal"></button></div>
</div>
<div class="sum" id="sum"></div>`}
function live(pulse){head();
 if(tab!=='today')return;
 const w=cur,c=S.counts[w]||0,g=goalOf(S,w),p=Math.min(c/g,1);
 $('#cnt').textContent=c;$('#of').textContent='الهدف '+g;
 $('#ring').style.strokeDashoffset=C*(1-p);
 $('#ringwrap').classList.toggle('complete',c>=g);
 $('#chips').innerHTML=chipsHTML();
 $('#undoBtn').disabled=!(c>0)||(S.done.includes(w)&&c<=g);
 $('#goalBtn').textContent='تغيير الهدف ('+g+')';
 $('#sum').innerHTML=`<span>اليوم: <b>${sum(S.counts)}</b> ذكر</span><span>أوراد مكتملة: <b>${S.done.length}</b> / ${WIRDS.length}</span>`;
 if(pulse){const b=$('#bigbtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}}

/* عرض الجلسات */
function sheadHTML(x,extra){const n=listOf(x).length,d=doneCount(x),done=S.sd.includes(x);
 return `<div class="shead${done?' complete':''}"><div class="st"><b>${SN[x]}</b><span>${d} / ${n}</span></div><div class="bar"><i style="width:${Math.round(d/n*100)}%"></i></div>
 <p class="hint">${extra} كل بند ‎+${PTS[x]} نقطة، وإتمام الجلسة ‎+${BONUS[x]} نقطة.</p></div>`}
function adhItem(x,it){const c=S.pr[x][it.id]||0,n=it.n,d=c>=n;const text=(x==='pm'&&it.te)?it.te:it.t;
 const lab=n>1?(d?'تم ✓':'اضغط للعدّ · '+c+' / '+n):(d?'تم ✓':'أتممتها');
 return `<div class="it${d?' dn':''}"><p class="tx">${text}</p><p class="meta">${n>1?`<span class="rp">التكرار ${n} مرات</span>`:''}${it.v}</p>
 <div class="row"><button class="cb" data-act="inc" data-i="${it.id}">${lab}</button>${c>0?`<button class="ghost" data-act="dec" data-i="${it.id}">تراجع</button>`:''}</div></div>`}
function hzItem(x,it,i){const c=S.pr[x][it.id]||0,d=c>=1;
 const lines=it.lines.map(l=>`<span class="ln">${l.l?`<b>${l.l}:</b> `:''}${l.t}${l.r?` <em class="rp">(${l.r})</em>`:''}</span>`).join('');
 return `<div class="it${d?' dn':''}"><span class="sec">الفقرة ${i+1} من ${HZ.length}</span><p class="tx">${it.head?`<span class="ln hd">${it.head}</span>`:''}${lines}${it.foot?`<span class="ft">${it.foot}</span>`:''}</p>
 <div class="row"><button class="cb" data-act="inc" data-i="${it.id}">${d?'تمّت ✓':'أتممت هذه الفقرة'}</button>${d?`<button class="ghost" data-act="dec" data-i="${it.id}">تراجع</button>`:''}</div></div>`}
function nafHTML(){let h=sheadHTML('nf','صلِّ ما تيسّر لك من النوافل.');let g='';
 for(const it of NAF){if(it.g!==g){g=it.g;h+=`<h3>${g}</h3>`+(GNOTE[g]?`<p class="gnote">${GNOTE[g]}</p>`:'')}
  const d=(S.pr.nf[it.id]||0)>=1;
  h+=`<div class="it${d?' dn':''}"><div class="nfh"><b>${it.n}</b><span class="rp">${rk(it.r)}</span></div><p class="d">${it.d}</p>
  <div class="row"><button class="cb" data-act="tog" data-i="${it.id}" aria-pressed="${d}">${d?'تم ✓ · اضغط للإلغاء':'صلّيتها'}</button></div></div>`}
 return h}
function fillSess(){if(tab!=='adh'&&tab!=='naf')return;
 const ch=$('#schips');if(ch)ch.innerHTML=['am','pm','hm','hp'].map(x=>{const n=listOf(x).length,d=doneCount(x),ok=S.sd.includes(x);
  return `<button class="chip${ok?' done':''}" data-act="sub" data-s="${x}" aria-pressed="${x===sub}"><span>${SCHIP[x]}</span><small>${ok?'✓':d+' / '+n}</small></button>`}).join('');
 const b=$('#sbody');if(!b)return;
 if(tab==='naf'){b.innerHTML=nafHTML();return}
 if(sub==='am'||sub==='pm'){b.innerHTML=sheadHTML(sub,sub==='am'?'تُقرأ في الصباح.':'تُقرأ في المساء.')+listOf(sub).map(it=>adhItem(sub,it)).join('')}
 else{b.innerHTML=sheadHTML(sub,sub==='hm'?'تُقرأ بعد صلاة الصبح.':'تُقرأ بعد صلاة المغرب.')+`<p class="ist">أعوذ بالله من الشيطان الرجيم، بسم الله الرحمن الرحيم</p>`+HZ.map((it,i)=>hzItem(sub,it,i)).join('')}}

function chalHTML(){const cs=todaysChals();return `<h2>تحديات اليوم</h2><p class="hint">ثلاثة تحديات جديدة كل يوم. كل تحدٍّ مكتمل يمنحك 30 نقطة.</p>`+cs.map(c=>{
 const p=prog(c,S),ok=p>=c.n,cl=S.claimed.includes(c.id);
 return `<div class="card${cl?' claimed':''}"><p>${c.t}</p><div class="bar"><i style="width:${Math.round(p/c.n*100)}%"></i></div>
 <div class="crow"><span>${p} / ${c.n}</span><button class="claim" data-act="claim" data-c="${c.id}" ${(!ok||cl)?'disabled':''}>${cl?'تم الاستلام':ok?'استلم 30 نقطة':'قيد التنفيذ'}</button></div></div>`}).join('')}
function badgeHTML(){return `<h2>حصيلتك</h2><div class="stats"><div class="stat"><b>${life(S)}</b><span>إجمالي الأذكار</span></div><div class="stat"><b>${S.best}</b><span>أفضل سلسلة (أيام)</span></div><div class="stat"><b>${S.chalDone}</b><span>تحديات مكتملة</span></div></div>
 <h2>الإنجازات</h2><div class="badges">`+BADGES.map(b=>`<div class="badge${S.badges.includes(b.id)?' on':''}"><b>${b.n}</b><span>${b.d}</span></div>`).join('')+`</div>
 <p class="note">يُحتسب اليوم في السلسلة إذا أتممتَ وردين، أو جلستين، أو وردًا وجلسة.</p>
 <p class="note">النقاط وسيلة للمواظبة فقط، والعمل لله وحده.</p>`}
function render(){head();const v=$('#view');
 v.innerHTML=tab==='rem'?remHTML():tab==='today'?todayHTML():tab==='adh'?'<div class="chips" id="schips"></div><div id="sbody"></div>':tab==='naf'?'<div id="sbody"></div>':tab==='chal'?chalHTML():badgeHTML();
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
 if(tab==='today')live(false);else fillSess()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 if(a==='tab'){tab=el.dataset.tab;render();window.scrollTo(0,0)}
 else if(a==='pick'){cur=el.dataset.w;render()}
 else if(a==='tap')tap();
 else if(a==='undo')undo();
 else if(a==='goal')cycleGoal();
 else if(a==='claim')claim(el.dataset.c)
 else if(a==='sub'){sub=el.dataset.s;fillSess();window.scrollTo(0,0)}
 else if(a==='inc'){const i=el.dataset.i;setCnt(sub,i,(S.pr[sub][i]||0)+1)}
 else if(a==='dec'){const i=el.dataset.i;setCnt(sub,i,(S.pr[sub][i]||0)-1)}
 else if(a==='tog'){const i=el.dataset.i;setCnt('nf',i,(S.pr.nf[i]||0)>=1?0:1)}
 else if(a==='perm')askPerm();
 else if(a==='ntest')testNotif()});
document.addEventListener('change',e=>{const el=e.target,rid=el.dataset&&el.dataset.rid;if(!rid)return;
 const c=Object.assign({},S.rem[rid]);if(el.type==='checkbox')c.on=el.checked;else if(el.value)c.t=el.value;
 S.rem[rid]=c;touch()});

checkBadges();render();setMode('local');initNotif();

(async()=>{try{
 if(!(window.claude&&window.claude.use))return;
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!db||!user)return;const id=await user.id();if(!id)return;
 docRef=db.doc('data/users/'+id+'/state');
 const snap=await docRef.get();
 if(snap.exists){const r=snap.data();if((r.t||0)>(S.t||0)){S=norm(clone(r));rollover(S);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();setMode('cloud')}else if(S.t){await flush()}else setMode('cloud')}
 else if(S.t){await flush()}else{setMode('cloud')}
}catch(e){setMode('local')}})();
</script>

</body></html>
